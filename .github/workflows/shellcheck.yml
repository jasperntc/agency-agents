name: ShellCheck

# The distribution layer is ~2,600 lines of bash that must run identically on
# macOS bash 3.2, Linux, and Git Bash on Windows, with no jq and no runtime
# dependencies. That is a lot of portability surface with no static analysis.
#
# shellcheck ships preinstalled on ubuntu-latest, so this needs no third-party
# action and nothing to pin.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "**/*.sh"
      - ".github/workflows/shellcheck.yml"
  workflow_dispatch:

jobs:
  shellcheck:
    name: Static analysis of shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        run: shellcheck --version

      # severity=error only, to start. The goal is a signal that is worth
      # reacting to; a wall of style warnings on inherited code trains everyone
      # to ignore the check. Tighten to `warning` once errors are clean and the
      # backlog is understood -- not before.
      #
      # lib.sh is sourced rather than executed, so -x lets shellcheck follow the
      # `. lib.sh` in convert.sh and install.sh instead of guessing.
      - name: shellcheck (severity=error)
        run: shellcheck --severity=error --external-sources $(git ls-files '*.sh')

      # Full-severity output for visibility only. Never blocking: this is the
      # backlog, recorded so it can be worked down deliberately.
      - name: Full findings (informational)
        continue-on-error: true
        run: shellcheck --external-sources $(git ls-files '*.sh')
