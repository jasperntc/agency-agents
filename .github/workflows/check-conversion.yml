name: Check Conversion

# Conversion must be reproducible before anything measures what it produces.
#
# metrics/conversion-manifest.json records a sha256 for every file convert.sh
# generates. Regenerating here and comparing catches two different failures:
#
#   * non-determinism -- locale-dependent sort order, timestamps, hash-seed
#     iteration, text-mode newline translation. The manifest is generated on one
#     OS and verified on another, so platform-dependent output fails here.
#   * unintended renderer changes -- editing a converter, or a frontmatter value
#     it reads, changes generated bytes. Often correct, but it should be
#     deliberate and visible rather than found later by a consumer.
#
# The manifest is a lockfile, not build output: it holds hashes, not files. The
# repository's "generated output is never committed" rule is intact.
on:
  push:
    branches: [main]
  pull_request:
    # Generated output depends only on these inputs. Unlike the agent linter,
    # a path filter is sound here: nothing outside this set can change what
    # convert.sh emits. push to main is unfiltered regardless.
    paths:
      - "academic/**"
      - "design/**"
      - "engineering/**"
      - "finance/**"
      - "game-development/**"
      - "gis/**"
      - "healthcare/**"
      - "marketing/**"
      - "paid-media/**"
      - "product/**"
      - "project-management/**"
      - "sales/**"
      - "security/**"
      - "spatial-computing/**"
      - "specialized/**"
      - "support/**"
      - "testing/**"
      - "scripts/convert.sh"
      - "scripts/lib.sh"
      - "scripts/build-hermes-plugin.py"
      - "scripts/conversion_manifest.py"
      - "divisions.json"
      - "metrics/conversion-manifest.json"
      - ".github/workflows/check-conversion.yml"
  workflow_dispatch:

jobs:
  conversion:
    name: Generated output matches the manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Runs every converter into a temp directory and compares hashes.
      # Never writes to integrations/.
      - name: Verify conversion output
        run: python3 scripts/conversion_manifest.py --check metrics/conversion-manifest.json

      - name: Nothing written into integrations/
        run: |
          if [ -n "$(git status --porcelain integrations/)" ]; then
            echo "::error::conversion wrote into integrations/ instead of the temp dir"
            git status --porcelain integrations/
            exit 1
          fi
          echo "integrations/ clean"
