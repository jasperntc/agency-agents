name: Full Corpus Audit

# Everything expensive or whole-corpus, on a schedule instead of on every PR.
#
# The PR path is deliberately narrow (changed files only), which means
# pre-existing defects are never revisited: a file that was already broken when
# the checks were introduced is never in anyone's diff. This job is what finds
# them. It is also the only place the O(n^2) originality audit runs.
on:
  schedule:
    # Mondays 06:17 UTC. Off the hour so it is not queued with everything else.
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  audit:
    name: Whole-corpus validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint every agent file
        run: |
          chmod +x scripts/lint-agents.sh
          ./scripts/lint-agents.sh

      # Audit mode: every agent against every other, not just changed files.
      - name: Originality audit (every agent vs every agent)
        run: |
          chmod +x scripts/check-agent-originality.sh
          ./scripts/check-agent-originality.sh

      - name: Catalog consistency
        run: |
          chmod +x scripts/check-divisions.sh scripts/check-tools.sh scripts/check-runbooks.sh
          ./scripts/check-divisions.sh
          ./scripts/check-tools.sh
          ./scripts/check-runbooks.sh
          python3 scripts/check-hermes-plugin.py

      - name: Corpus diversity gate
        run: python3 scripts/corpus_diversity.py --gate metrics/thresholds.json

      - name: Detector regression test
        run: python3 tests/test_corpus_diversity.py

      # Informational: reports what has changed since the fork point. Not a
      # gate -- intentional corpus repairs make this diverge by design.
      - name: Drift from frozen baseline (informational)
        continue-on-error: true
        run: |
          python3 scripts/inventory.py --check metrics/inventory-baseline.json
          python3 scripts/corpus_diversity.py --check metrics/diversity-baseline.json
